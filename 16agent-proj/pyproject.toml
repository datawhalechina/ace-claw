[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-agent-mcp"
version = "0.1.0"
description = "Stateful MCP server for verifiable math/physics derivations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sympy>=1.13",
  "streamlit>=1.39",
  # This server uses the v1 FastMCP API.
  "mcp>=1.2.0,<2",
  "openai>=1.61.0",
  # Imported directly by llm_client, independently of SDK transitive dependencies.
  "httpx>=0.27,<1",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
